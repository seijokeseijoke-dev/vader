name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ "web/**", ".github/workflows/pages.yml", "README.md" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # krävs för att skapa Release med APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name APK after version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          FILE="vader-${VERSION}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vader-debug-apk
          path: ${{ steps.apk.outputs.file }}

      # Vid push till main: skriv över grenen "apk" (en enda commit, ingen växande historik)
      - name: Publish APK to branch apk (overwrite)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          D=$(mktemp -d)
          cp "${{ steps.apk.outputs.file }}" "$D/vader.apk"
          cd "$D"
          echo "Version ${{ steps.apk.outputs.version }}, build ${{ github.run_number }}, commit ${{ github.sha }}" > VERSION.txt
          printf '# Senaste APK\n\n[Ladda ner vader.apk](https://github.com/${{ github.repository }}/raw/apk/vader.apk)\n\nSe VERSION.txt för version. Grenen skrivs över vid varje bygge.\n' > README.md
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "APK ${{ steps.apk.outputs.version }} build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      # En enda release "senaste" som skrivs över (taggen flyttas till aktuell commit)
      - name: Move tag senaste
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp "${{ steps.apk.outputs.file }}" vader.apk
          git tag -f senaste
          git push -f origin refs/tags/senaste

      - name: Publish Release (overwrite)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senaste
          name: Väder 6 dagar – senaste APK
          body: |
            Version ${{ steps.apk.outputs.version }}, build ${{ github.run_number }}, från ${{ github.sha }}.
            Ladda ner vader.apk nedan och installera på telefonen (tillåt installation från okänd källa).
            Den här releasen skrivs över vid varje bygge.
          files: vader.apk
          overwrite_files: true
          make_latest: true
